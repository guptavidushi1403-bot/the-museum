<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>The Museum</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <main id="museum" aria-label="An emotional atlas of art — a moving gallery">
    <canvas id="gl"></canvas>
    <div id="whisper" class="whisper"></div>
    <div id="reveal" class="reveal">
      <div id="reveal-text" class="reveal-text"></div>
      <div id="reveal-attr" class="reveal-attr"></div>
    </div>
    <canvas id="whole" class="whole"></canvas>
    <div id="frame" class="frame"></div>
    <div id="label" class="exp-label"></div>
    <button id="plaque" class="plaque" aria-label="Return to the gallery">⟵&ensp;Return to the Gallery</button>
    <div id="veil" class="dark"></div>
    <div id="passage" class="passage">entering the painting…</div>
  </main>
  <noscript><p class="noscript">The museum needs JavaScript to open its doors.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
